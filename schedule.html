  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1a2027;
      --paper-raised: #232a33;
      --paper-sunken: #161b21;
      --ink: #e8ecef;
      --ink-soft: #a7b1bc;
      --ink-faint: #707b87;
      --rule: #313b45;
      --rule-strong: #404c58;
      --accent-ink: #cdd8e5;
      --locked-bg: repeating-linear-gradient(135deg, #202730, #202730 6px, #1a2027 6px, #1a2027 12px);

      --chip-s: 42%;
      --chip-l-bg: 23%;
      --chip-l-border: 40%;
      --chip-l-text: 87%;
    }
  }

  :root[data-theme="dark"] {
    --paper: #1a2027;
    --paper-raised: #232a33;
    --paper-sunken: #161b21;
    --ink: #e8ecef;

    --rule: #313b45;
    --rule-strong: #404c58;

    --focus-ring: #cdd8e5;

    --chip-s: 42%;
    --chip-l-bg: 23%;
    --chip-l-border: 40%;
    --chip-l-text: 87%;

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);

    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;

  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
  .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; font-variant-numeric: tabular-nums; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    background: var(--paper-raised);
    border-bottom: 1px solid var(--rule);
    flex: 0 0 auto;
  }
  .topbar h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.01em; }
  .topbar .subtitle { margin: 1px 0 0; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .topbar-left { min-width: 0; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }

  .save-indicator {
    font-size: 11px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: #838d99; flex: 0 0 auto; }

  .calendar-toolbar {

    align-items: baseline;
    justify-content: space-between;
    flex: 0 0 auto;

    grid-template-columns: 74px repeat(3, 1fr);
    gap: 8px;
    padding: 6px 0;
    border-top: 1px solid var(--rule);

  .week-label { display: flex; align-items: center; font-size: 11px; color: var(--ink-soft); font-weight: 600; }

    min-height: 92px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
  }

  .cal-cell .cell-date { font-size: 10px; color: var(--ink-faint); flex: 0 0 auto; }
  .cal-cell .cell-content { flex: 1 1 auto; display: flex; min-height: 0; }

    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .cal-cell.locked .lock-note { font-size: 10.5px; color: var(--locked-text); line-height: 1.35; }

  .cal-cell.assignable:not(.occupied) .cell-content {
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
    font-size: 10.5px;
  }
  .cal-cell.assignable:not(.occupied) .cell-date { position: absolute; top: 6px; left: 8px; }

  /* ---------- Lecture card ---------- */
  .lecture-card {
    border-radius: 7px;
    border: 1px solid hsl(var(--h) var(--chip-s) var(--chip-l-border));
    background: hsl(var(--h) var(--chip-s) var(--chip-l-bg));
    padding: 6px 7px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .card-desc {
    font-size: 11px;
    line-height: 1.4;
    color: hsl(var(--h) var(--chip-s) var(--chip-l-text));
    opacity: 0.85;
    white-space: pre-wrap;
    padding-top: 3px;
    border-top: 1px solid hsl(var(--h) var(--chip-s) var(--chip-l-border));
  }
  .lecture-card .card-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .lecture-card .card-id { font-size: 9.5px; color: hsl(var(--h) var(--chip-s) var(--chip-l-text)); opacity: 0.7; }
  .lecture-card .card-format {
    font-size: 8.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: hsl(var(--h) var(--chip-s) var(--chip-l-text));
    opacity: 0.65;
  }
  .lecture-card .card-title {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: 11.5px;
    line-height: 1.28;
    color: hsl(var(--h) var(--chip-s) var(--chip-l-text));
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .lecture-card.gray-lecture { --chip-s: 12%; }

  .card-links {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 5px;
    margin-top: 1px;
  }
  .card-link {
    font-size: 9.5px;
    line-height: 1.3;
    color: hsl(var(--h) var(--chip-s) var(--chip-l-text));
    background: hsl(var(--h) var(--chip-s) var(--chip-l-border) / 0.35);
    border: 1px solid hsl(var(--h) var(--chip-s) var(--chip-l-border));
    border-radius: 4px;
    padding: 1px 5px;
    text-decoration: none;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-link:hover { text-decoration: underline; }
  .card-link:before { content: "🔗 "; font-size: 8px; }

  .legend {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    padding: 8px 20px 14px;
    border-top: 1px solid var(--rule);
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: hsl(var(--h) 60% 55%);
    border: 1px solid hsl(var(--h) 60% 40%);
    flex: 0 0 auto;
  }
</style>

    onValue(stateRef, function (snapshot) {
      applyState(snapshot.val());
      setSyncStatus("synced", "Live");
    }, function (err) {
      setSyncStatus("error", "Could not connect (" + err.message + ")");
    });
  } catch (err) {
    setSyncStatus("error", "Could not connect");
  }
})();
</script>
